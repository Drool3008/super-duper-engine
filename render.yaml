# Render Blueprint: one free web service serving the API, the SSE stream and the
# built UI from the same origin. Secrets are entered in the dashboard (sync: false).
services:
  - type: web
    name: vantari
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_PROVIDER
        value: gemini
      - key: MODEL_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GNANI_API_KEY
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
